name: Android APK (Debug)

# Der APK-Bau dauert rund zwei Minuten. Wer Actions-Minuten sparen will,
# kommentiert den push-Block aus und startet den Lauf nur noch von Hand.
on:
  push:
    branches: [main, master]
    paths-ignore: ["README.md", "LICENSE", ".gitignore"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Wie bei FairSeat: v4 und "packages" ausdrücklich setzen. Der Standard
      # "tools platform-tools" bricht ab, weil Google das veraltete Paket
      # "tools" seit dem 15.09.2026 nicht mehr ausliefert
      # (android-actions/setup-android#537). Plattform und Build-Tools lädt
      # Gradle beim Bauen selbst nach.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # Wie bei FairSeat: Plattform und Build-Tools ausdrücklich holen, statt
      # auf das automatische Nachladen durch Gradle zu vertrauen.
      # Capacitor 7: compileSdk 35, AGP 8.7 nutzt Build-Tools 34/35.
      - name: SDK-Pakete nachziehen
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Web-App bauen
        run: npm run build

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          LOG="$RUNNER_TEMP/gradle.log"
          if ! ./gradlew assembleDebug --no-daemon --stacktrace > "$LOG" 2>&1; then
            # Die Ursache steht bei Gradle unter "What went wrong" – als Annotation ausgeben.
            sed -n '/What went wrong/,/Try:/p' "$LOG" | grep -v '^\s*$' | head -12 | while IFS= read -r z; do echo "::error title=Gradle::$z"; done
            tail -80 "$LOG"; exit 1
          fi
          tail -15 "$LOG"

      - name: APK hochladen
        uses: actions/upload-artifact@v6
        with:
          name: waagemodell-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
