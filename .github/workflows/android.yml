name: Android APK (Debug)

# Der APK-Bau dauert rund zwei Minuten. Wer Actions-Minuten sparen will,
# kommentiert den push-Block aus und startet den Lauf nur noch von Hand.
on:
  push:
    branches: [main, master]
    paths-ignore: ["README.md", "LICENSE", ".gitignore"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Web-App bauen
        run: npm run build

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK hochladen
        uses: actions/upload-artifact@v6
        with:
          name: waagemodell-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
