name: Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # enablement: true schaltet GitHub Pages beim ersten Lauf selbst ein
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Link in die Zusammenfassung schreiben
        run: |
          {
            echo "## Waagemodell ist online"
            echo ""
            echo "${{ steps.deployment.outputs.page_url }}"
            echo ""
            echo "Der Link bleibt gleich, der Inhalt wird bei jedem Push neu gebaut."
          } >> "$GITHUB_STEP_SUMMARY"
